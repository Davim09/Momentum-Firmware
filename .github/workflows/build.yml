name: "FAP: Build for Momentum mntm-011"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-fap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Dependências Python p/ uFBT (evita erro de 'ansi', 'scons', etc.)
      - name: Install uFBT and deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ufbt scons ansi colorama tomli typing_extensions

      # Aponta o uFBT para o SDK do Momentum (mntm-011)
      - name: Prepare SDK (Momentum)
        run: ufbt update --index-url https://up.momentum-fw.dev/firmware/directory.json --channel=release

      # Build do FAP (usa application.fam no diretório raiz)
      - name: Build FAP
        run: ufbt

      # Publica o .fap como artefato para download
      - name: Upload FAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfc_relay-fap
          path: dist/*.fap
